# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己手动名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  - {name: 默认代理, type: select, include-all: true, proxies: [ 自动选择, 直连, 香港自动, 日本自动, 狮城自动, 美国自动, 台湾自动, 韩国自动, 其他自动, 自动选择, 香港手动, 日本手动, 狮城手动, 美国手动, 台湾手动, 韩国手动, 其他手动], <<: *Flight}
  - {name: 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连)).)*$"}
