  hk1: &hk1 {filter: "(?=.*(港|HK|(?i)Hong Kong))^((?!(日|台|韩|新|美)).)*$"}
  kr1: &kr1 {filter: "(?=.*(韩|KR|(?i)Korea))^((?!(港|日|台|新|美)).)*$"}
  sg1: &sg1 {filter: "(?=.*(新|狮|SG|(?i)Singapore))^((?!(港|日|台|韩|美)).)*$"}
  us1: &us1 {filter: "(?=.*(美|US|(?i)USA))^((?!(港|日|台|韩|新)).)*$"}
  other1: &other1 {filter: "^((?!(港|HK|(?i)Hong Kong|台|TW|(?i)Taiwan|日|JP|(?i)Japan|韩|KR|(?i)Korea|新加坡|狮|SG|(?i)Singapore|美|US|(?i)USA)).)*$"}
