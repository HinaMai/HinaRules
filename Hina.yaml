  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true ##允许局域网
bind-address: "*" 
ipv6: false ##ipv6开关
unified-delay: true
tcp-concurrent: true
log-level: warning
#global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
##自动选择缓存
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true # tun模式开启
  # system（系统）/gvisor/mixed（混合）
  stack: system
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
  default-nameserver: ##后备dns服务器
    - 223.5.5.5
  #proxy-server-nameserver: ##代理服务器DNS
  #  - https://dns.alidns.com/dns-query
  #  - https://doh.pub/dns-query
  direct-nameserver: ##直连dns服务器
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver: ##主DNS服务器
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
######### 锚点 start #######
# 策略组相关
pr: &pr {type: select, proxies: [ 默认代理, 直连, 自动选择, 香港自动, 日本自动, 狮城自动, 美国自动, 台湾自动, 韩国自动, 其他自动, 自动选择, 香港手动, 日本手动, 狮城手动, 美国手动, 台湾手动, 韩国手动, 其他手动]}
#这里是订阅更新和延迟测试相关的
p: &p {type: http, interval: 3600, health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}}
