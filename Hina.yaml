# 机场订阅
proxy-providers:
  Airport1:
    url: "https://vps.hina.us.ci:2096/HinaMai/Hina"
    type: http
    interval: 86400
    ##健康检测
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
